seed: 0

data:
  dataset: cifar10
  root: ./data
  batch_size: 256
  num_workers: 4
  probe_train_samples: 5000
  # 5000 rather than 2000: the probe's binomial standard error is
  # sqrt(p(1-p)/n), ~0.011 at n=2000 and ~0.007 at n=5000. Differences smaller
  # than that are unresolvable however many checkpoints are logged.
  probe_test_samples: 5000

model:
  image_size: 32
  patch_size: 4
  embed_dim: 192
  depth: 6
  num_heads: 3
  mlp_ratio: 4.0
  predictor_hidden_dim: 384
  # 0 disables the projector: the regularizer then acts directly on the pooled
  # context embedding (the original, audit-flagged configuration). Projector
  # conditions override this to 512, matching LeJEPA's launcher. The probe and
  # all diagnostics read the encoder regardless.
  projector_dim: 0
  projector_hidden_dim: 512

masking:
  num_target_blocks: 4
  target_block_scale: [0.15, 0.2]
  target_block_aspect: [0.75, 1.5]

optim:
  lr: 0.001
  weight_decay: 0.05
  warmup_steps: 500
  total_steps: 32000

logging:
  checkpoint_every: 500
  projection_samples: 500
  output_root: ./experiments

strategy:
  name: ema_stopgrad
  uses_ema_target: true
  detaches_target: true
  ema_decay: 0.996
  # Reference LeJEPA forms a convex combination, sigreg*lambda + other*(1-lambda),
  # and sweeps lambda over {0.01, 0.02, 0.05, 0.1}. This project uses the additive
  # form prediction + weight*sigreg, so weight = lambda/(1-lambda), i.e. roughly
  # 0.01 to 0.11. Condition files that enable SIGReg set it explicitly.
  sigreg_weight: 0.0
  sigreg_num_slices: 1024
  sigreg_num_freqs: 17
  sigreg_freq_max: 3.0
