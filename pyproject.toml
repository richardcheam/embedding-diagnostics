[project]
name = "embedding-diagnostics"
version = "0.1.0"
description = "Which label-free diagnostics detect a degenerate self-supervised embedding?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.5",
  "torchvision>=0.20",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "transformers==5.19.0",
  "pylance>=0.39,<1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

# ONE PIN FOR EVERY MACHINE. cu128 is deliberate and should not be "upgraded"
# per-machine: CUDA drivers are BACKWARD compatible, so a cu128 build runs on a
# 12.8 driver and equally on a 13.0 one, while a cu130 build cannot run on 12.8
# at all. Pinning cu130 for a newer box would therefore break the older one --
# the exact failure this project already hit. cu128 also ships sm_75 through
# sm_120 kernels and both x86_64 and aarch64 wheels, so it covers a Turing
# workstation and a Grace-Hopper node from the same lockfile. Results have to be
# comparable across machines, which needs the same build on all of them.
#
# Linux training machines pull torch from PyTorch's CUDA 12.8 index rather than
# PyPI. The default PyPI wheel tracks the newest CUDA major version, which a
# 12.x driver cannot run at all — CUDA is only minor-version compatible, so a
# cu130 build fails outright on a 12.8 driver regardless of the GPU. The marker
# keeps macOS on ordinary PyPI wheels, since no cu128 build exists for it.
# If you move to a machine with a CUDA 13 driver, change 'cu128' below.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_diagnostics"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts", "viz"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
