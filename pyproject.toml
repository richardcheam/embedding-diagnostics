[project]
name = "jepa-lens"
version = "0.1.0"
description = "Does stop-gradient still matter under SIGReg at scale?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.5",
  "torchvision>=0.20",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jepa_lens"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts", "viz"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
