[project]
name = "jina-replication-extraction"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0+cu128", "torchvision==0.26.0+cu128",
  "numpy==2.5.1", "pillow==12.3.0", "transformers==4.49.0",
  "timm==1.0.15", "einops==0.8.1", "accelerate==1.5.2",
  "pytest>=8", "threadpoolctl>=3",
]
[tool.uv]
package = false
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
